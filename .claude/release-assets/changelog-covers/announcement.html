<!--
  ANNOUNCEMENT: broad news with no single control to draw (a milestone, a
  round-up, a pricing or policy change). Three emojis that tell the story,
  on a tinted grid.
-->
<div class="canvas bg-mint">
    <div class="grid at" style="left: -40px; top: -40px; right: -40px; bottom: -40px; grid-template-columns: 120px repeat(3, 1fr) 120px; grid-template-rows: 200px 1fr 200px; background: #fff">
        <span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span>
        <span style="background: #e3f7e9"></span><span style="background: var(--bg-mint)">🚀</span><span style="background: var(--bg-mint)">📣</span><span style="background: var(--bg-mint)">🎁</span><span style="background: #e3f7e9"></span>
        <span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span><span style="background: #e3f7e9"></span>
    </div>
</div>
