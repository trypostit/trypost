<!--
  FEATURE (default scene): the composer-like panel with the new settings and
  the network's badge centered above it. Example: Instagram reels gain
  collaborators, music and trial reels. Draw only what the entry is about, and
  use one icon per idea everywhere (here `movie` is the reel).
-->
<div class="canvas bg-violet">
    <div class="surface panel has-badge at" style="left: 190px; top: 238px; width: 820px">
        <div class="badge" style="background: #e1306c"><i data-icon="brand-instagram"></i></div>
        <div class="setting">
            <i data-icon="users"></i>Collaborators
            <span class="control"><span class="handle">@paulocastellano</span><span class="handle">@apple</span></span>
        </div>
        <div class="setting">
            <i data-icon="music"></i>Music
            <span class="control"><span class="track"><span class="art" style="background: var(--primary-strong)"><i data-icon="player-play" data-filled></i></span>Golden hour</span></span>
        </div>
        <div class="setting">
            <i data-icon="movie"></i>Trial Reels
            <span class="control"><span class="switch"></span></span>
        </div>
    </div>
</div>
