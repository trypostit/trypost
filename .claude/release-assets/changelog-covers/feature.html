<!--
  FEATURE (default scene): what the user posts, plus the settings that are new,
  drawn as the composer shows them. Example: Instagram reels gain
  collaborators, music and trial reels. Draw only what the entry is about.
-->
<div class="canvas bg-violet">
    <div class="surface reel at" style="left: 120px; top: 70px; transform: rotate(-4deg)">
        <div class="frame" style="background: radial-gradient(circle at 70% 30%, #fde68a 0 9%, transparent 9.5%), linear-gradient(180deg, #c4b5fd 0%, #f0abfc 48%, #fb923c 100%)">
            <svg class="at" style="left: 0; bottom: 0" width="300" height="240" viewBox="0 0 280 240" preserveAspectRatio="none">
                <path d="M0 120 C 60 80, 110 150, 170 110 S 250 90, 280 120 L 280 240 L 0 240 Z" fill="#7c3aed" opacity="0.55" />
                <path d="M0 170 C 70 130, 130 200, 200 160 S 260 150, 280 170 L 280 240 L 0 240 Z" fill="#4c1d95" opacity="0.6" />
            </svg>
            <div class="top"><i data-icon="movie"></i>Reels</div>
            <div class="sound"><i data-icon="music"></i>Golden hour · Mira</div>
        </div>
    </div>

    <div class="surface panel at" style="left: 410px; top: 116px">
        <div class="head"><i data-icon="brand-instagram"></i>Instagram</div>
        <div class="setting">
            <i data-icon="at"></i>Collaborators
            <span class="control"><span class="handle">@nina</span><span class="handle">@leomakes</span></span>
        </div>
        <div class="setting">
            <i data-icon="music"></i>Music
            <span class="control"><span class="track"><span class="art" style="background: linear-gradient(135deg, #fb923c, #c026d3)"></span>Golden hour</span></span>
        </div>
        <div class="setting">
            <i data-icon="video"></i>Trial reel
            <span class="control"><span class="switch"></span></span>
        </div>
    </div>
</div>
