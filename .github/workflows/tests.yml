name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_CONNECTION: pgsql
  DB_DATABASE: trypost_test
  DB_USERNAME: postgres
  DB_PASSWORD: password
  BROADCAST_CONNECTION: "null"
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array

jobs:
  tests:
    name: Tests (${{ matrix.name }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        name: [PostgreSQL, MySQL]
        shard: [1, 2]
        include:
          - name: PostgreSQL
            connection: pgsql
            image: postgres:16
            port: '5432'
            username: postgres
            health: '--health-cmd="pg_isready"'
          - name: MySQL
            connection: mysql
            image: mysql:8.4
            port: '3306'
            username: root
            health: '--health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ppassword"'

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_USERNAME: ${{ matrix.username }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trypost_test
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: trypost_test
        ports:
          - ${{ matrix.port }}/tcp
        options: >-
          ${{ matrix.health }}
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup test environment
        uses: ./.github/actions/setup-laravel
        with:
          db-port: ${{ job.services.database.ports[matrix.port] }}
          redis-port: ${{ job.services.redis.ports['6379'] }}

      - name: Run backend tests
        env:
          DB_PORT: ${{ job.services.database.ports[matrix.port] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: ./vendor/bin/pest --compact --parallel --shard=${{ matrix.shard }}/2

      - name: Show logged warnings of failed tests
        if: failure()
        run: grep -h "WARNING\|ERROR" storage/logs/*.log | tail -n 50 || true

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()

    steps:
      - name: Fail unless every engine passed
        run: '[ "${{ needs.tests.result }}" = "success" ]'

  browser:
    name: Browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: trypost_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup test environment
        uses: ./.github/actions/setup-laravel
        with:
          node: 'true'
          db-port: ${{ job.services.postgres.ports['5432'] }}
          redis-port: ${{ job.services.redis.ports['6379'] }}

      - name: Build assets
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run browser tests
        env:
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: ./vendor/bin/pest tests/Browser --compact --parallel --processes=4 --shard=${{ matrix.shard }}/2

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [browser]
    if: always()

    steps:
      - name: Fail unless every browser shard passed
        run: '[ "${{ needs.browser.result }}" = "success" ]'
